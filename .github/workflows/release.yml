name: release
run-name: Build version ${{ github.ref_name }}
on:
  push:
    tags:        
      - '*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Build Windows
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: |
          npm run package:win
          npm run package:portable
          Rename-Item -LiteralPath 'dist/exile-diary-reborn-portable.zip' -NewName "exile-diary-reborn-portable-v${{ github.ref_name }}.zip"
      - name: Smoke packaged sidecars
        run: npm run test:packaged-sidecars
      - name: Smoke packaged renderer
        run: npm run test:packaged-renderer
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          overwrite: true
          path: |
            dist/exile-diary-reborn-setup-v*.exe
            dist/exile-diary-reborn-setup-v*.exe.blockmap
            dist/exile-diary-reborn-portable-v*.zip
            dist/latest.yml
      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/exile-diary-reborn-setup-v*.exe
            dist/exile-diary-reborn-setup-v*.exe.blockmap
            dist/exile-diary-reborn-portable-v*.zip
            dist/latest.yml

  # Build Linux
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils libxcb1-dev
      - name: Install flathub dependencies
        run: |
          flatpak remote-add -u --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install npm dependencies
        run: npm ci
      - name: Build app
        run: npm run package:linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          overwrite: true
          path: |
            dist/latest-linux.yml
            dist/exile-diary-reborn_v*_amd64.flatpak
            dist/exile-diary-reborn_v*_amd64.AppImage
      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/latest-linux.yml
            dist/exile-diary-reborn_v*_amd64.flatpak
            dist/exile-diary-reborn_v*_amd64.AppImage

  # Publish Release
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
