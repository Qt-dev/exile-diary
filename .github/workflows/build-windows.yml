name: build-windows
run-name: Building version v${{ inputs.version }} by @${{ github.actor }} for Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true

jobs:
  win-build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: |
          npm run package:win
          npm run package:portable
      - name: Smoke packaged sidecars
        run: npm run test:packaged-sidecars
      - name: Smoke packaged renderer
        run: npm run test:packaged-renderer
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          if-no-files-found: error
          path: |
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe.blockmap
            dist/exile-diary-reborn-portable-v${{ inputs.version }}.zip
            dist/latest.yml
      - name: Update release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe.blockmap
            dist/exile-diary-reborn-portable-v${{ inputs.version }}.zip
            dist/latest.yml
