name: build-windows
run-name: Building version v${{ inputs.version }} by @${{ github.actor }} for Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true

jobs:
  win-build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: |
          npm run package:win
          npm run package:portable
      - name: Smoke packaged sidecars
        run: npm run test:packaged-sidecars
      - name: Smoke packaged renderer
        run: npm run test:packaged-renderer
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          if-no-files-found: error
          path: |
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe.blockmap
            dist/exile-diary-reborn-portable-v${{ inputs.version }}.zip
            dist/latest.yml
      - name: Update release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe
            dist/exile-diary-reborn-setup-v${{ inputs.version }}.exe.blockmap
            dist/exile-diary-reborn-portable-v${{ inputs.version }}.zip
            dist/latest.yml
