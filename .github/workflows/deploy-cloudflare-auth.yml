name: Deploy Cloudflare auth worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing Cloudflare deployment credentials
        required: true
        default: cloudflare-production
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy auth worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-auth-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy
        run: npm run cloudflare:auth:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
