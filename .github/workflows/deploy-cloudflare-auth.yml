name: Deploy Cloudflare auth worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing Cloudflare deployment credentials
        required: true
        default: cloudflare-production
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy auth worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-auth-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy
        run: npm run cloudflare:auth:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
