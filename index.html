<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Exile Diary" />
    <link rel="apple-touch-icon" href="./logo128.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Exile Diary</title>
    <script>
      globalThis.global = globalThis;
      document.documentElement.dataset.renderer =
        window.location.hash === '#/overlay' ? 'overlay' : 'app';
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      html[data-renderer='overlay'],
      html[data-renderer='overlay'] body {
        background: transparent;
      }

      .RendererBootstrap {
        display: grid;
        min-height: 100vh;
        place-items: center;
        color: #aaa;
        font: 16px Georgia, serif;
      }

      html[data-renderer='overlay'] .RendererBootstrap {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="RendererBootstrap">Loading Exile Diary...</div></div>
    <script type="module" src="/src/renderer/index.jsx"></script>
  </body>
</html>
